<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Верификация Яндекс.Вебмастера (не удалять!) -->
    <meta name="yandex-verification" content="f3c6e1ae5ccbb4d3" />
    
    <title>Проекты Ивана Дурягина</title>
    <meta name="description" content="Портфолио проектов: ВиТИМ, ТИМ-ДПК, настольная игра Покорители Арктики.">
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #1a1a1a;
            --card-bg: #ffffff;
            --accent: #2a9d8f;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #f0f0f0;
                --card-bg: #1e1e1e;
                --accent: #4ecdc4;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
        }
        .projects {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .project-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(128, 128, 128, 0.1);
        }
        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }
        .project-icon {
            font-size: 2rem;
            margin-right: 20px;
        }
        .project-info h2 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }
        .project-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Проекты</h1>
        <p class="subtitle">Разработки и исследования</p>

        <div class="projects">
            <!-- Карточка 1: ВиТИМ -->
            <a href="https://ivanduryagin.github.io/IvanDuryagin.github.io-vitim/" class="project-card">
                <div class="project-icon">💧</div>
                <div class="project-info">
                    <h2>ВиТИМ</h2>
                    <p>Водоснабжение и технологии информационного моделирования</p>
                </div>
            </a>

            <!-- Карточка 2: ТИМ-ДПК (Укажите точный URL вашего репозитория) -->
            <a href="https://ivanduryagin.github.io/название-вашего-репозитория-тим-дпк/" class="project-card">
                <div class="project-icon">🌳</div>
                <div class="project-info">
                    <h2>ТИМ-ДПК</h2>
                    <p>Перенос данных об узлах ДПК из САПР в расчётные программы</p>
                </div>
            </a>

            <!-- Карточка 3: Покорители Арктики (Укажите точный URL вашего репозитория/папки) -->
            <a href="https://ivanduryagin.github.io/название-вашего-репозитория-игры/" class="project-card">
                <div class="project-icon">🧊</div>
                <div class="project-info">
                    <h2>Покорители Арктики</h2>
                    <p>Настольная игра о гонке к Северному полюсу</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
